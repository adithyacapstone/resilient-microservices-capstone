apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: inventory-network-delay
  namespace: default
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - default
    labelSelectors:
      app: inventory-service
  delay:
    latency: "2s"
    correlation: "100"
    jitter: "0ms"
  direction: to
  duration: "30s"