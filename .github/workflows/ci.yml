name: Build and Test Microservices

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: productdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d productdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Create additional databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d productdb -c "CREATE DATABASE inventorydb;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d productdb -c "CREATE DATABASE orderdb;"

      - name: Build and test Product Service
        working-directory: product-service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/productdb
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: mvn --batch-mode verify

      - name: Build and test Inventory Service
        working-directory: inventory-service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/inventorydb
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: mvn --batch-mode verify

      - name: Build and test Order Service
        working-directory: order-service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/orderdb
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: mvn --batch-mode verify
